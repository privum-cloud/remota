<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#0d0f15"/>
    </linearGradient>
    <clipPath id="sq">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
    <clipPath id="rmask">
      <text x="256" y="378" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="340">R</text>
    </clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- "R" preenchido com o tricolore italiano -->
    <g clip-path="url(#rmask)">
      <rect x="110" y="0" width="106" height="512" fill="#009246"/>
      <rect x="216" y="0" width="80"  height="512" fill="#f4f4f4"/>
      <rect x="296" y="0" width="120" height="512" fill="#ce2b37"/>
    </g>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#39435a" stroke-width="4"/>
</svg>
