[package]
name = "remota-agent"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Remota agent — connects out (WSS) to a remota-relay and tunnels local services"

[dependencies]
remota-proto = { path = "../proto" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
