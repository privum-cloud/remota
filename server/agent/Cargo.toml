[package]
name = "remota-agent"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Remota agent — connects out (WSS) to a remota-relay and tunnels local services"

[dependencies]
remota-proto = { path = "../proto" }
tokio = { version = "1", features = ["full"] }
# rustls + bundled webpki roots so the agent speaks wss:// to the relay (via Caddy/LE)
# without depending on system OpenSSL or the host cert store.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
